<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay</title>
  <link rel="stylesheet" href="overlay.css" />
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      background-color: transparent;
      color: white;
    }

    #dice-overlay {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .roll-entry {
      background-color: rgba(0, 0, 0, 0.7);
      border-left: 4px solid #4caf50;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      animation: fadein 0.3s ease;
    }

    .total {
      font-size: 1.5rem;
      color: #4caf50;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div id="dice-overlay"></div>

<script>
  const MODULE_ID = "foundry-dice-overlay";
  const overlay = document.getElementById("dice-overlay");
  const params = new URLSearchParams(location.search);

  // Lecture des paramètres (namespacing)
  const WORLD   = params.get("world") || "unknown-world";
  const CHANNEL = params.get("channel") || `${MODULE_ID}:${WORLD}`;
  const KEY_CONF = `${MODULE_ID}:${WORLD}:conf`;
  const KEY_LAST = `${MODULE_ID}:${WORLD}:last`;

  // Déduplication
  const seenIds = new Set();

  // État config courant, exposé à window pour JS custom
  let currentConfig = {
    html: "", css: "", js: "", enableJs: false,
    displayDuration: 8, displayMode: "single",
    systemUsed: "generic", filterGmRolls: "showAll",
    channel: CHANNEL, world: WORLD
  };
  window.FDO_CONFIG = currentConfig;

  // Applique CSS/JS de la config
  function applyConfig(cfg = {}) {
    currentConfig = Object.assign({}, currentConfig, cfg);
    window.FDO_CONFIG = currentConfig;

    // CSS
    let styleEl = document.getElementById("fdo-custom-css");
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = "fdo-custom-css";
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = currentConfig.css || "";

    // JS (réinjection à chaque update)
    const old = document.getElementById("fdo-custom-js");
    if (old) old.remove();
    if (currentConfig.enableJs && (currentConfig.js || "").trim()) {
      const s = document.createElement("script");
      s.id = "fdo-custom-js";
      s.textContent = currentConfig.js;
      document.body.appendChild(s);
    }

    console.log("[overlay] Config appliquée", currentConfig);
  }

  // Charge la config persistée (namespacée monde)
  function loadConfigFromStorage() {
    try {
      const raw = localStorage.getItem(KEY_CONF);
      if (!raw) return;
      const obj = JSON.parse(raw);
      const cfg = obj?.config || obj;
      applyConfig(cfg);
    } catch {}
  }

  // Moteur de template minimal {{key}} et {{config.xxx}}
  function renderTemplate(html, data) {
    if (!html || !html.trim()) return "";
    return html.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, path) => {
      try { return String(path.split(".").reduce((o, k) => (o != null ? o[k] : ""), data) ?? ""); }
      catch { return ""; }
    });
  }

  // Affichage d’un jet
  function displayRoll(data) {
    if (!data) return;

    const mid = data.messageId ?? null;
    if (mid) {
      if (seenIds.has(mid)) return;
      seenIds.add(mid);
      setTimeout(() => seenIds.delete(mid), 15000);
    }

    if (currentConfig.displayMode === "single") overlay.innerHTML = "";

    const node = document.createElement("div");
    node.className = "roll-entry";

    if ((currentConfig.html || "").trim()) {
      node.innerHTML = renderTemplate(currentConfig.html, { ...data, config: currentConfig });
    } else {
      node.innerHTML = `
        <strong>${data.actor ?? ""}</strong><br/>
        <em>${data.formula ?? ""}</em> → <span class="total">${data.total ?? ""}</span><br/>
        <small>${data.flavor ?? ""}</small>
      `;
    }

    overlay.appendChild(node);
    const dur = (Number(currentConfig.displayDuration) || 8) * 1000;
    setTimeout(() => node.remove(), dur);
  }

  // 1) BroadcastChannel
  let hasBC = false;
  try {
    const bc = new BroadcastChannel(CHANNEL);
    hasBC = true;
    bc.onmessage = (ev) => {
      try {
        const raw = typeof ev.data === "string" ? ev.data : (ev.data?.data ?? ev.data);
        const obj = JSON.parse(raw);

        if (obj && obj.__fdoType === "config") {
          applyConfig(obj.config || {});
          try { localStorage.setItem(KEY_CONF, JSON.stringify(obj)); } catch {}
          return;
        }

        // sinon : jet
        displayRoll(obj);
      } catch (e) {
        console.error("[overlay] Erreur parsing BC :", e);
      }
    };
    console.log("[overlay] Écoute BroadcastChannel =", CHANNEL, "world=", WORLD);
  } catch (e) {
    console.warn("[overlay] BroadcastChannel indisponible, fallback localStorage.");
  }

  // 2) Fallback 'storage' si pas de BC
  if (!hasBC) {
    window.addEventListener("storage", (e) => {
      if (!e.key || !e.newValue) return;

      if (e.key === KEY_CONF) {
        try {
          const obj = JSON.parse(e.newValue);
          applyConfig(obj?.config || obj || {});
        } catch {}
        return;
      }

      if (e.key === KEY_LAST) {
        const pipe = e.newValue.indexOf("|");
        const json = pipe >= 0 ? e.newValue.slice(pipe + 1) : e.newValue;
        try { displayRoll(JSON.parse(json)); } catch {}
      }
    });
  }

  // Démarrage : charger la config persistée
  loadConfigFromStorage();

  // --- Réception via Cloudflare Worker (si ?hub=... présent dans l'URL) ---
const hub = params.get("hub");
const channelParam = params.get("channel") || "foundry-dice-overlay:default";

if (hub) {
  const url = `${hub}?channel=${encodeURIComponent(channelParam)}`;
  let ws;
  try {
    ws = new WebSocket(url);
    ws.onopen = () => console.log("[overlay] WS connecté :", url);
    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        displayRoll(data);
      } catch (e) {
        console.error("[overlay] WS parse error:", e);
      }
    };
    ws.onerror = (e) => console.error("[overlay] WS error:", e);
    ws.onclose = () => console.warn("[overlay] WS fermé.");
  } catch (e) {
    console.error("[overlay] Impossible d’ouvrir le WS :", e);
  }
}

</script>

</body>
</html>
